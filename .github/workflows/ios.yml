name: Relay iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-checks:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test the Swift domain package
        run: swift test --package-path ios/Packages/RelayCore
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"] and d.get("isAvailable")]; preferred=next((d for d in devices if "iPhone 16 Pro" == d["name"]), devices[0]); print(preferred["udid"])')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build the native app and test runner
        id: build
        run: |
          xcodebuild build-for-testing \
            -project ios/Relay.xcodeproj \
            -scheme Relay \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO
      - name: Run the native UI tests
        run: |
          xcodebuild test-without-building \
            -project ios/Relay.xcodeproj \
            -scheme Relay \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' \
            -derivedDataPath ios/build \
            -parallel-testing-enabled NO \
            -resultBundlePath ios/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture the native app
        if: always() && steps.build.conclusion == 'success'
        run: |
          DEVICE_ID='${{ steps.simulator.outputs.device_id }}'
          xcrun simctl install "$DEVICE_ID" ios/build/Build/Products/Debug-iphonesimulator/Relay.app
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl terminate "$DEVICE_ID" com.pranayjoshi.relay || true
          xcrun simctl launch "$DEVICE_ID" com.pranayjoshi.relay -ui-testing
          sleep 3
          mkdir -p ios/screenshots
          xcrun simctl io "$DEVICE_ID" screenshot ios/screenshots/relay-iphone-light.png
          xcrun simctl ui "$DEVICE_ID" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot ios/screenshots/relay-iphone-dark.png
      - name: Upload simulator build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-ios-simulator
          path: |
            ios/TestResults.xcresult
            ios/screenshots
            ios/build/Build/Products/Debug-iphonesimulator/Relay.app
          retention-days: 7
