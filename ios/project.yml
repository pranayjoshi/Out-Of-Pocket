name: Relay
options:
  bundleIdPrefix: com.pranayjoshi
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '16.0'
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  RelayCore:
    path: Packages/RelayCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: Relay
    dependencies:
      - package: RelayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranayjoshi.relay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RelayUITests
    dependencies:
      - target: Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranayjoshi.relay.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relay:
    build:
      targets:
        Relay: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RelayUITests
      gatherCoverageData: false
